name: Build complete English Parenting Print Pack
on:
  push:
    branches: [master]
    paths: ['.github/workflows/build-complete-parenting.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and PDF tools
        run: python -m pip install pillow reportlab pypdf
      - name: Build complete eleven cards
        run: python parenting/everyday-parenting/build_complete.py
      - name: Verify all output formats and PDF pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          import zipfile
          base=Path("parenting/everyday-parenting")
          files=list((base/"print").glob("*.png"))
          assert len(files)==11
          for f in files:
              im=Image.open(f); im.verify()
          assert len(PdfReader(base/"Everyday_Parenting_A4.pdf").pages)==11
          with zipfile.ZipFile(base/"Everyday_Parenting_Print.zip") as z:
              assert len([n for n in z.namelist() if n.startswith("print/") and n.endswith(".png")])==11
          print("Verified all eleven PNGs and PDF pages")
          PY
      - name: Commit deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parenting/everyday-parenting
          git commit -m "Complete 11 English printable parenting cards and PDF"
          git push origin HEAD:master
