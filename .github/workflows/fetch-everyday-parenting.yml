name: Fetch Everyday Parenting cards

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fetch-everyday-parenting.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          docker run -d --name bgutil-provider --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 5

      - name: Capture 11 English lesson cards
        shell: bash
        run: |
          set -euo pipefail
          OUT="parenting/everyday-parenting"
          TMP="/tmp/everyday-parenting"
          mkdir -p "$OUT" "$TMP"

          capture() {
            local name="$1"
            local video="$2"
            local second="$3"
            local start=$((second - 2))
            local end=$((second + 2))
            local base="$TMP/$name"
            rm -f "$base".*

            echo "Capturing $name at ${second}s"
            if ! yt-dlp \
              --no-playlist \
              --extractor-args "youtube:player_client=mweb" \
              --download-sections "*${start}-${end}" \
              --force-keyframes-at-cuts \
              -f "bestvideo[height<=1080]/best[height<=1080]/best" \
              -o "$base.%(ext)s" \
              "https://www.youtube.com/watch?v=$video"; then
              echo "mweb failed; retrying web_safari/HLS"
              yt-dlp \
                --no-playlist \
                --extractor-args "youtube:player_client=web_safari" \
                --download-sections "*${start}-${end}" \
                --force-keyframes-at-cuts \
                -f "best[height<=1080]/best" \
                -o "$base.%(ext)s" \
                "https://www.youtube.com/watch?v=$video"
            fi

            local input
            input="$(find "$TMP" -maxdepth 1 -type f -name "$name.*" | head -n1)"
            test -n "$input"
            ffmpeg -hide_banner -loglevel error -y -ss 2 -i "$input" \
              -frames:v 1 "$OUT/$name.png"
            file "$OUT/$name.png"
          }

          capture 01_Praise              mJLROkpYd0I 173
          capture 02_Antecedents         sH7XVS2kruk 765
          capture 03_Shaping             DQ7YiXEQKzQ 462
          capture 04_Simulation          UO7t70O7PNw 503
          capture 05_Modeling            EXv4AGQUBDo 510
          capture 06_Positive_Opposite   rib2y_lFjRs 395
          capture 07_Point_Programs      umIZuKJfxXk 355
          capture 08_Attending           Z4y4RY9JoXk 390
          capture 09_Planned_Ignoring    Z4y4RY9JoXk 750
          capture 10_Punishment          _Qb1bpS9o_4 570
          capture 11_Time_Out            Oa0AwRyHRl8 465

          cat > "$OUT/README.md" <<'EOF'
          # Everyday Parenting — English lesson cards

          Frames captured from the public YaleCourses **Everyday Parenting: The ABCs of Child Rearing** videos for personal study/reference.

          | # | Topic | Video ID | Capture time |
          |---|---|---|---:|
          | 1 | Praise | `mJLROkpYd0I` | 02:53 |
          | 2 | Antecedents | `sH7XVS2kruk` | 12:45 |
          | 3 | Shaping | `DQ7YiXEQKzQ` | 07:42 |
          | 4 | Simulation | `UO7t70O7PNw` | 08:23 |
          | 5 | Modeling | `EXv4AGQUBDo` | 08:30 |
          | 6 | Positive Opposite | `rib2y_lFjRs` | 06:35 |
          | 7 | Point Programs | `umIZuKJfxXk` | 05:55 |
          | 8 | Attending | `Z4y4RY9JoXk` | 06:30 |
          | 9 | Planned Ignoring | `Z4y4RY9JoXk` | 12:30 |
          | 10 | Punishment | `_Qb1bpS9o_4` | 09:30 |
          | 11 | Time Out | `Oa0AwRyHRl8` | 07:45 |

          Source playlist: YaleCourses, Everyday Parenting.
          EOF

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parenting/everyday-parenting
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Everyday Parenting lesson cards"
            git push origin HEAD:master
          fi
